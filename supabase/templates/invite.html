<!--
  Invitation email — note 06 §14.2.

  POINTS AT token_hash, NOT AT ConfirmationURL. GoTrue's default invite link
  goes to its own /verify endpoint, which returns the session in the URL
  FRAGMENT. A fragment is never sent to a server, so our callback saw no code
  and treated a perfectly good invitation as a broken link.

  `next` carries the invitee to the password form, where a password is optional
  (owner, 2026-10-23): accepting confirms the address, so an email link or
  Google signs them in afterwards, and the form offers "Skip for now".
-->
<h2>You've been invited</h2>

<p>
  You have been invited to an account on Tony Klinger. Follow the link below to
  accept. You can choose a password, or sign in with an email link or Google
  instead.
</p>

<p>
  <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=invite&next=%2Fauth%2Freset-password%3Finvited%3D1">
    Accept the invitation
  </a>
</p>

<p>If you were not expecting this, you can ignore this email.</p>
