# Scheduled jobs for the TEST deploy, while the Vercel project is on Hobby
# (which allows a cron only once a day). It calls the same authenticated
# /api/cron/[job] routes Vercel Cron will call at launch, on the same
# schedules as vercel.json.test; nothing else changes.
#
# Delete this file when the project moves to Pro and vercel.json.test becomes
# vercel.json — one scheduler per job (note 09 §44). A new cron job goes into
# both files until then.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SITE_URL     the deploy's address, e.g. https://tonyklinger-combined-website.vercel.app
#   CRON_SECRET  the same value as CRON_SECRET on Vercel
#
# The repository is public while it is on the test account, so Actions minutes
# are free. If it goes private before launch these schedules would exceed the
# free allowance (every run bills at least a minute): switch Vercel Cron on
# instead, or thin these out.
#
# GitHub can start a scheduled run late, or skip one when busy. Every job
# catches up on outstanding work, so that only delays it. Times are UTC, as on
# Vercel.

name: Scheduled jobs

on:
  schedule:
    - cron: "*/5 * * * *"         # send-emails
    - cron: "*/15 * * * *"        # reconcile-stripe, event-reminders
    - cron: "5,20,35,50 * * * *"  # session-reminders
    - cron: "10 * * * *"          # expire-entitlements
    - cron: "20 * * * *"          # sync-stripe
    - cron: "30 3 * * *"          # cleanup-tokens
    - cron: "45 3 * * *"          # cleanup-uploads
    - cron: "45 4 * * *"          # sync-audiences
    - cron: "0 9 * * *"           # pass-reminders
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run, space separated (blank = send-emails)"
        required: false
        default: ""

# One queue per schedule. A single shared group would let GitHub drop runs
# that were waiting behind each other when several schedules fire together.
concurrency:
  group: scheduled-jobs-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the cron routes
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.jobs }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL and CRON_SECRET repository secrets are required"
            exit 1
          fi

          case "$SCHEDULE" in
            "*/5 * * * *")        jobs="send-emails" ;;
            "*/15 * * * *")       jobs="reconcile-stripe event-reminders" ;;
            "5,20,35,50 * * * *") jobs="session-reminders" ;;
            "10 * * * *")         jobs="expire-entitlements" ;;
            "20 * * * *")         jobs="sync-stripe" ;;
            "30 3 * * *")         jobs="cleanup-tokens" ;;
            "45 3 * * *")         jobs="cleanup-uploads" ;;
            "45 4 * * *")         jobs="sync-audiences" ;;
            "0 9 * * *")          jobs="pass-reminders" ;;
            *)                    jobs="${MANUAL:-send-emails}" ;;
          esac

          failed=0
          for job in $jobs; do
            # The repository is public, and so are these logs: print the status
            # only, never the job's reply. Details are in the Vercel logs.
            status=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 120 --retry 2 --retry-delay 10 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "${SITE_URL%/}/api/cron/$job") || status=000
            echo "$job → $status"
            [ "$status" = "200" ] || { echo "::error::$job returned $status"; failed=1; }
          done
          exit $failed
